[project]
name = "centralign-task-worker"
version = "0.1.0"
description = "Autonomous AI task worker: generic agent core + sandbox company app"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.59",
  "google-genai>=1.30",
  "anthropic>=1.0",
  "openai>=1.0",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "rich>=13",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["worker", "worker.toolsets", "sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
